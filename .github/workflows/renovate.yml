name: Renovate

on:
  workflow_dispatch:
  schedule:
    # 05:00 UTC daily. renovate.json still waits 25 hours after a publish before opening a PR.
    - cron: "0 5 * * *"

# Renovate uses RENOVATE_TOKEN for clones and pull requests. The workflow token only checks out the config.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check Renovate token
        id: token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -n "$RENOVATE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Renovate is not running::Add the RENOVATE_TOKEN repository secret (a GitHub token that can write contents, pull requests, and workflows). Disable this workflow if the Renovate GitHub App is installed on the repository, otherwise updates run twice."
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5

      - name: Run Renovate
        if: steps.token.outputs.present == 'true'
        uses: renovatebot/github-action@v46.2.5
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
