<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveMemory — Add concert</title>
  <style>
    /*
      Spine sections: EXPERIENCE.md Component Patterns (Add sheet: bottom
      glass panel, Artist focused, Event prefilled, festival day picker,
      Save then Add another); Interaction Primitives (mobile-first add,
      prefill FR-7, multi-artist night); Information Architecture (Add
      Concert from owned Event); Voice and Tone (Add concert, notes
      placeholder). DESIGN.md Elevation & Depth (light scrim, not blackout;
      add-sheet blur 28px, fill #141414, top corners 24px), Components
      (add-sheet, button-primary, glass-nav).
      Flow: Key Flows Flow 3 climax (Add concert with day + Place prefilled).
      Festival: no Attend this night.
    */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #2a2a2a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 32px 16px;
    }
    .phone {
      width: 402px;
      background: #0a0a0a;
      border-radius: 48px;
      padding: 6px;
      border: 1px solid #3a3a3a;
    }
    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #000;
      border-radius: 42px;
      overflow: hidden;
    }
    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 8;
    }
    .status {
      position: relative;
      z-index: 4;
      height: 54px;
      padding: 16px 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
    }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons svg { display: block; }
    .behind {
      height: calc(844px - 54px);
      padding: 8px 16px 88px;
      overflow: hidden;
    }
    .display {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .meta {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
      color: #A3A3A3;
    }
    .bill {
      margin-top: 22px;
      background: #1A1A1A;
      border-radius: 16px;
      padding: 14px 16px 8px;
    }
    .day-label {
      font-size: 13px;
      font-weight: 600;
      color: #A3A3A3;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
    }
    .artist {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }
    .going {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 9999px;
      background: transparent;
      color: #FF4D8A;
      border: 1px solid #FF4D8A;
      box-shadow: 0 0 8px rgba(255, 77, 138, 0.4);
      font-size: 12px;
      font-weight: 600;
    }
    .ghost {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 9999px;
      background: transparent;
      color: #A3A3A3;
      border: 1px dashed #A3A3A3;
      box-shadow: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.08);
      z-index: 3;
    }
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 78px;
      z-index: 5;
      background: rgba(20, 20, 20, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 24px 24px 0 0;
      padding: 8px 16px 16px;
      max-height: 560px;
    }
    .handle {
      width: 36px;
      height: 5px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.28);
      margin: 4px auto 12px;
    }
    .sheet-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 14px;
    }
    label.field-label {
      display: block;
      font-size: 13px;
      color: #A3A3A3;
      margin: 0 0 6px;
    }
    .field {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      background: rgba(10, 10, 10, 0.88);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .field:focus {
      outline: 2px solid #fff;
      outline-offset: 0;
    }
    .field[readonly] {
      color: #fff;
    }
    .field-artist {
      caret-color: #fff;
    }
    .days {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .day-chip {
      flex: 1;
      min-height: 44px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      background: rgba(10, 10, 10, 0.88);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
    }
    .day-chip span {
      display: block;
      color: #A3A3A3;
      font-weight: 400;
      font-size: 11px;
    }
    .day-chip.selected {
      background: #FF4D8A;
      border-color: #FF4D8A;
      color: #000;
    }
    .day-chip.selected span {
      color: #000;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
    }
    .btn-primary {
      flex: 1;
      min-height: 44px;
      border: 2px solid #FF4D8A;
      border-radius: 9999px;
      background: transparent;
      color: #FF4D8A;
      box-shadow: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
    }
    .add-another {
      background: none;
      border: 0;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 0;
      white-space: nowrap;
    }
    .nav {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 10px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
      background: rgba(20, 20, 20, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      z-index: 6;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 64px;
      min-height: 44px;
      color: #fff;
      font-size: 11px;
      font-weight: 500;
    }
    .nav-item.active {
      color: #FF4D8A;
    }
    .nav-item.active .icon-wrap {
      background: #FF4D8A;
      color: #000;
    }
    .icon-wrap {
      width: 48px;
      height: 28px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-add .icon-wrap {
      width: 44px;
      height: 32px;
      background: #fff;
      color: #000;
    }
    .home-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 128px;
      height: 4px;
      background: #fff;
      border-radius: 9999px;
      opacity: 0.35;
      z-index: 7;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status">
        <span>22:21</span>
        <div class="status-icons">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><path d="M8 2.2c2.2 0 4.2.8 5.8 2.2l-1.1 1.1A6.6 6.6 0 0 0 8 3.8 6.6 6.6 0 0 0 3.3 5.5L2.2 4.4A9.1 9.1 0 0 1 8 2.2Zm0 3.2a5 5 0 0 1 3.5 1.4L10.4 8A3.2 3.2 0 0 0 8 7a3.2 3.2 0 0 0-2.4 1L4.5 6.8A5 5 0 0 1 8 5.4Zm0 3.3a1.7 1.7 0 0 1 1.2.5L8 10.4 6.8 9.2A1.7 1.7 0 0 1 8 8.7Z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.5" y="1" width="21" height="10" rx="2.5" stroke="#fff" fill="none" opacity="0.45"/><rect x="2" y="2.5" width="16" height="7" rx="1.2" fill="#fff"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.5" fill="#fff" opacity="0.45"/></svg>
        </div>
      </div>
      <div class="behind">
        <h1 class="display">Rock en Seine</h1>
        <p class="meta">21–24 Aug 2026</p>
        <p class="meta">Saint-Cloud</p>
        <div class="bill">
          <p class="day-label">Friday 21 Aug</p>
          <div class="row">
            <div>
              <p class="artist">The Last Dinner Party</p>
              <p class="meta">Île Stage · 20:15</p>
            </div>
            <button class="ghost" type="button" aria-label="Mark as going">Going</button>
          </div>
          <div class="row">
            <div>
              <p class="artist">Fontaines D.C.</p>
              <p class="meta">Main Stage · 22:00</p>
            </div>
            <span class="going">Going</span>
          </div>
          <div class="row">
            <div>
              <p class="artist">Justice</p>
              <p class="meta">Main Stage · 23:45</p>
            </div>
            <span class="going">Going</span>
          </div>
        </div>
      </div>
      <div class="scrim"></div>
      <div class="sheet">
        <div class="handle"></div>
        <h2 class="sheet-title">Add concert</h2>
        <label class="field-label" for="artist">Artist</label>
        <input class="field field-artist" id="artist" type="text" value="" autofocus>
        <label class="field-label" for="event">Event</label>
        <input class="field" id="event" type="text" value="Rock en Seine" readonly>
        <p class="field-label">Day</p>
        <div class="days">
          <button class="day-chip selected" type="button" aria-pressed="true">Fri<span>21 Aug</span></button>
          <button class="day-chip" type="button">Sat<span>22 Aug</span></button>
          <button class="day-chip" type="button">Sun<span>23 Aug</span></button>
          <button class="day-chip" type="button">Mon<span>24 Aug</span></button>
        </div>
        <label class="field-label" for="place">Place</label>
        <input class="field" id="place" type="text" value="Saint-Cloud" readonly>
        <label class="field-label" for="stage">Stage or Scene</label>
        <input class="field" id="stage" type="text" value="">
        <div class="actions">
          <button class="btn-primary" type="button">Save</button>
          <button class="add-another" type="button">Add another</button>
        </div>
      </div>
      <nav class="nav" aria-label="Main">
        <div class="nav-item">
          <span class="icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
          </span>
          Home
        </div>
        <div class="nav-item active">
          <span class="icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
          </span>
          Concerts
        </div>
        <div class="nav-item nav-add">
          <span class="icon-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </span>
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Add concert</span>
          Add
        </div>
        <div class="nav-item">
          <span class="icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.2c.8-3.2 3.3-5 6.5-5s5.7 1.8 6.5 5"/></svg>
          </span>
          Profile
        </div>
      </nav>
      <div class="home-bar"></div>
    </div>
  </div>
</body>
</html>
